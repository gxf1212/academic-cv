bio: |
  I am a doctoral researcher in the College of Life Sciences at Zhejiang University.
  My advisor is [Prof. Ruhong Zhou](https://person.zju.edu.cn/en/ruhong), Qiushi Chair Professor.
  I use molecular dynamics, free-energy calculations, and machine learning to study biomolecular interactions
  and build reproducible computational workflows for drug discovery and biomaterials research.

